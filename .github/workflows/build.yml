name: BUild Succeeds on PR

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
        
      - name: Install Dependencies
        run: npm install -D @tailwindcss/postcss @emotion/react @emotion/styled typescript
      
      - name: Run build
        run: npm run build