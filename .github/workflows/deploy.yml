name: build and deploy to docker

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: check out Repo
      uses: actions/checkout@v2

    - name: login to docker hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: isandeep4/carbonfootprint-repo:latest

    - name: verify pushed image
      run: docker pull isandeep4/carbonfootprint-repo:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo docker pull isandeep4/carbonfootprint-repo:latest
          sudo docker stop carbonfootprint-repo || true
          sudo docker rm carbonfootprint-repo || true
          sudo docker run -d --name carbonfootprint-repo -p 3005:3000 isandeep4/carbonfootprint-repo:latest
